<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualización de Datos | Plataforma Territorial</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .data-section {
            margin-bottom: 50px;
        }
        
        .data-section h2 {
            border-bottom: 2px solid #2c3e50;
            padding-bottom: 10px;
            margin-bottom: 25px;
        }

        /* Grilla unificada para ambas secciones */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }

        .chart-card {
            background: #fff;
            border-radius: 8px;
            border: 1px solid #eee;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }

        .chart-card:hover {
            transform: translateY(-5px);
        }

        .chart-img {
            width: 100%;
            height: auto;
            cursor: zoom-in;
            display: block;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
    </style>
</head>
<body>

    <header class="page-header">
        <img src="https://cmasudd-aigame.github.io/ptowilliams/puertowilliamsdrone2.jpg" alt="Datos Puerto Williams" class="header-image-full">
        <div class="title-overlay">
            <h1>Repositorio de Datos Tácticos</h1>
            <p>Análisis del Gemelo Digital y Mediciones In-Situ</p>
        </div>
    </header>

    <nav>
        <ul>
                        <li><a href="index.html">Inicio</a></li>
            <li><a href="experimento.html">Experimento</a></li>
            <li><a href="gemelodigital.html">Gemelo Digital</a></li>
            <li><a href="diseno.html">Diseño</a></li>
            <li><a href="datos.html">Datos</a></li>
            <li><a href="puertowilliams2.html">Puerto Williams</a></li>
            <li><a href="meteorologia.html">Meteorología</a></li>
        </ul>
    </nav>

    <main class="main-content">
        
        <section class="data-section">
            <h2>1. Análisis del Gemelo Digital</h2>
            <div class="charts-grid">
                <div class="chart-card"><img src="https://cmasudd-aigame.github.io/ptowilliams/gemelo1.jpeg" class="chart-img img-zoom" alt="Gráfico 1"></div>
                <div class="chart-card"><img src="https://cmasudd-aigame.github.io/ptowilliams/gemelo2.jpeg" class="chart-img img-zoom" alt="Gráfico 2"></div>
                <div class="chart-card"><img src="https://cmasudd-aigame.github.io/ptowilliams/gemelo3.jpeg" class="chart-img img-zoom" alt="Gráfico 3"></div>
                <div class="chart-card"><img src="https://cmasudd-aigame.github.io/ptowilliams/gemelo4.jpeg" class="chart-img img-zoom" alt="Gráfico 4"></div>
                <div class="chart-card"><img src="https://cmasudd-aigame.github.io/ptowilliams/gemelo5.jpeg" class="chart-img img-zoom" alt="Gráfico 5"></div>
                <div class="chart-card"><img src="https://cmasudd-aigame.github.io/ptowilliams/gemelo6.jpeg" class="chart-img img-zoom" alt="Gráfico 6"></div>
                <div class="chart-card"><img src="https://cmasudd-aigame.github.io/ptowilliams/gemelo7.jpeg" class="chart-img img-zoom" alt="Gráfico 7"></div>
                <div class="chart-card"><img src="https://cmasudd-aigame.github.io/ptowilliams/gemelo8.jpeg" class="chart-img img-zoom" alt="Gráfico 8"></div>
            </div>
        </section>

        <section class="data-section">
            <h2>2. Experimento Puerto Williams: Temperatura de Suelo</h2>
            <div class="charts-grid">
                <div class="chart-card"><img src="https://cmasudd-aigame.github.io/ptowilliams/tempSueloWilliams.jpg" class="chart-img img-zoom" alt="Suelo 1"></div>
                <div class="chart-card"><img src="https://cmasudd-aigame.github.io/ptowilliams/tempSueloWilliams2.jpg" class="chart-img img-zoom" alt="Suelo 2"></div>
            </div>
        </section>

    </main>

    <div id="imageModal" class="modal">
        <span style="position:absolute; top:20px; right:30px; color:white; font-size:40px; cursor:pointer;" onclick="closeModal()">&times;</span>
        <img id="imgFull" style="max-width:90%; max-height:90%;">
    </div>

    <script>
        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("imgFull");
        document.querySelectorAll('.img-zoom').forEach(img => {
            img.onclick = function() {
                modal.style.display = "flex";
                modalImg.src = this.src;
            }
        });
        function closeModal() { modal.style.display = "none"; }
        window.onclick = function(event) { if (event.target == modal) closeModal(); }
    </script>
</body>
</html>
